[package]
name = "throne_fast_core"
version = "1.4.2"
edition = "2021"
authors = ["Throne Project & Antigravity"]
description = "High-performance Rust acceleration core for Throne (empowered by sing-box)"

[lib]
name = "throne_fast_core"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

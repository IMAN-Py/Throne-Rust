name: Rust Acceleration Core & Differential CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'throne_fast_core/**'
      - 'include/throne_fast_core.h'
      - 'cmake/throne_fast_core.cmake'
      - 'tests/**'
      - 'core/**'
      - 'installer/**'
      - 'scoop/**'
      - '.github/workflows/rust-core.yml'
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  PROTOC_VERSION: "36.2"

jobs:
  rust-go-cpp-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install protoc and Go protobuf plugins
        shell: pwsh
        run: |
          $protocUrl = "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-win64.zip"
          $protocZip = "$env:RUNNER_TEMP\protoc.zip"
          $protocDir = "$env:RUNNER_TEMP\protoc"
          Invoke-WebRequest -Uri $protocUrl -OutFile $protocZip
          Expand-Archive -Path $protocZip -DestinationPath $protocDir -Force
          "$protocDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$protocDir\bin;$env:PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          $goBin = "$(go env GOPATH)\bin"
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$goBin;$env:PATH"
          Push-Location core\gen
          protoc -I . --go_out=. --go-grpc_out=. libcore.proto
          Pop-Location

      - name: Format, lint, test, and build Rust crate (throne_fast_core)
        shell: pwsh
        run: |
          cd throne_fast_core
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release -- --nocapture
          cargo build --release

      - name: Run C++20 <-> Rust differential & benchmark suite
        shell: pwsh
        run: |
          $dll = "$PWD\throne_fast_core\target\release\throne_fast_core.dll"
          $lib = "$PWD\throne_fast_core\target\release\throne_fast_core.dll.lib"
          New-Item -ItemType Directory -Force tests\bin | Out-Null
          Copy-Item $dll tests\bin\throne_fast_core.dll -Force
          cl.exe /nologo /std:c++20 /O2 /EHsc /Iinclude tests\cpp_fast_core_test.cpp /Fe:tests\bin\cpp_fast_core_test.exe /link $lib
          .\tests\bin\cpp_fast_core_test.exe

      - name: Run Go vet & differential tests against throne_fast_core.dll
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:THRONE_FAST_CORE_DLL = "$PWD\throne_fast_core\target\release\throne_fast_core.dll"
          cd core
          go vet ./internal/fastcore ./internal/probe ./internal/rpc ./internal/rulematch ./internal/scan
          go test -count=1 -v ./internal/fastcore ./internal/probe ./internal/rpc ./internal/rulematch ./internal/scan

      - name: Engine/UI boundary check
        shell: pwsh
        run: |
          cmake -DROOT="$PWD" -P cmake/EngineBoundary.cmake
